<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#020612"/>
  <title>Aurora City FC — Login Test</title>
  <style>
    :root{--bg:#020612;--panel:#071222;--line:rgba(125,211,252,.25);--text:#eaf4ff;--muted:#93a4bd;--green:#34d399;--red:#fb7185;--amber:#fbbf24}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 5%,rgba(34,211,238,.18),transparent 30%),linear-gradient(180deg,#020612,#061224);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(620px,100%);border:1px solid var(--line);border-radius:26px;padding:24px;background:rgba(7,18,34,.94);box-shadow:0 24px 80px rgba(0,0,0,.45)}
    h1{margin:0;font-size:34px;letter-spacing:-.045em}p{color:var(--muted);line-height:1.5}.status{margin:16px 0;padding:13px 14px;border:1px solid rgba(148,163,184,.18);border-radius:15px;background:rgba(2,6,23,.55);color:#dbeafe}.status.ok{border-color:rgba(52,211,153,.4);color:#d1fae5}.status.error{border-color:rgba(251,113,133,.45);color:#fecdd3}.status.working{border-color:rgba(251,191,36,.4);color:#fde68a}
    form{display:grid;gap:13px}label{display:grid;gap:7px;color:#cbd5e1;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}input{width:100%;padding:13px 14px;border:1px solid rgba(148,163,184,.24);border-radius:14px;background:#020617;color:#fff;font:inherit}.password{display:grid;grid-template-columns:1fr auto;gap:8px}.password button{padding:0 14px}
    button,a{border:1px solid rgba(125,211,252,.3);border-radius:14px;padding:12px 15px;background:linear-gradient(135deg,#0891b2,#2563eb);color:white;font:900 14px/1 Inter,system-ui;text-decoration:none;cursor:pointer}button.secondary{background:rgba(15,23,42,.75)}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <h1>Aurora Cloud login test</h1>
    <p>This checks Firebase sign-in only. It cannot upload, replace or delete any Aurora records.</p>
    <div class="status working" id="status">Loading Firebase securely…</div>
    <form id="loginForm">
      <label>Email address<input id="email" type="email" autocomplete="username" required/></label>
      <label>Password<div class="password"><input id="password" type="password" autocomplete="current-password" required/><button class="secondary" id="showPassword" type="button">Show</button></div></label>
      <button id="signInButton" type="submit" disabled>Loading sign-in…</button>
    </form>
    <div class="actions" id="successActions" hidden><a href="AuroraCloudSync.html?v=20260730-cloud5">Return to Cloud Sync</a></div>
    <p class="small">Your password is sent directly to Firebase Authentication and is not stored by this page.</p>
  </main>

  <script type="module">
    const status=document.getElementById('status');
    const form=document.getElementById('loginForm');
    const button=document.getElementById('signInButton');
    const password=document.getElementById('password');
    const successActions=document.getElementById('successActions');
    const show=(text,type='')=>{status.textContent=text;status.className='status'+(type?' '+type:'');};
    window.addEventListener('error',event=>show('Page error: '+(event.message||'Unknown error'),'error'));
    window.addEventListener('unhandledrejection',event=>show('Firebase error: '+(event.reason?.message||String(event.reason)),'error'));
    document.getElementById('showPassword').addEventListener('click',()=>{const visible=password.type==='text';password.type=visible?'password':'text';document.getElementById('showPassword').textContent=visible?'Show':'Hide';});

    try{
      const [{initializeApp,getApps},{getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,onAuthStateChanged}]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js')
      ]);
      const config={apiKey:'AIzaSyCWniUugILvyvTqXCnpQQQ352V0ECKPKo0',authDomain:'aurora-city-fc.firebaseapp.com',projectId:'aurora-city-fc',storageBucket:'aurora-city-fc.firebasestorage.app',messagingSenderId:'254659241407',appId:'1:254659241407:web:f6c0e7daf5d1d65b7d6d0a'};
      const appName='aurora-cloud-sync';
      const app=getApps().find(item=>item.name===appName)||initializeApp(config,appName);
      const auth=getAuth(app);
      try{await setPersistence(auth,browserLocalPersistence);}catch(_){}
      button.disabled=false;button.textContent='Sign in to Aurora Cloud';show('Firebase loaded. Enter your Aurora email and password.','ok');
      onAuthStateChanged(auth,user=>{if(user){show('Signed in successfully.','ok');form.hidden=true;successActions.hidden=false;}});
      form.addEventListener('submit',async event=>{
        event.preventDefault();button.disabled=true;button.textContent='Signing in…';show('Contacting Firebase…','working');
        try{
          await Promise.race([
            signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),password.value),
            new Promise((_,reject)=>setTimeout(()=>reject(new Error('Sign-in timed out after 20 seconds.')),20000))
          ]);
        }catch(error){
          const code=error?.code?' ('+error.code+')':'';show((error?.message||String(error))+code,'error');button.disabled=false;button.textContent='Sign in to Aurora Cloud';
        }
      });
    }catch(error){show('Firebase could not load: '+(error?.message||String(error)),'error');button.textContent='Firebase unavailable';}
  </script>
</body>
</html>
