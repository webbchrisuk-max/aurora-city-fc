<!doctype html>
<html lang="en" data-aurora-page="manager">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>Aurora City FC — Shared Hero Prototype</title>
  <link rel="stylesheet" href="aurora-hero.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020612;color:#eaf4ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:radial-gradient(circle at 14% 0%,rgba(34,211,238,.18),transparent 30%),radial-gradient(circle at 88% 0%,rgba(96,165,250,.16),transparent 30%),linear-gradient(180deg,#020612,#030712 60%,#020612)}
    .demo-shell{width:min(1580px,100%);margin:0 auto;padding:18px 18px 70px}
    .demo-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 2px;color:#93a4bd;font-size:12px}
    .demo-heading strong{color:#a5f3fc;font-size:14px}
    .demo-note{margin-top:14px;padding:14px 16px;border:1px solid rgba(125,211,252,.16);border-radius:18px;background:rgba(8,24,45,.72);color:#9fb0c5;font-size:12px;line-height:1.55}
  </style>
</head>
<body>
  <main class="demo-shell">
    <div class="demo-heading">
      <strong>Aurora City FC — Shared Hero Prototype</strong>
      <span>Manager Dashboard master design</span>
    </div>

    <div
      id="auroraHero"
      data-aurora-hero
      data-page="manager"
      data-hero-image="https://raw.githubusercontent.com/webbchrisuk-max/aurora-city-fc/main/assets/aurora-city-fc/hero/managerdash.PNG">
    </div>

    <div class="demo-note">
      Standalone approval prototype only. No existing Aurora HTML page has been changed. The specialist content for each department will sit below this identical shared hero when pages are migrated one by one.
    </div>
  </main>
  <script src="aurora-hero.js"></script>
</body>
</html>
