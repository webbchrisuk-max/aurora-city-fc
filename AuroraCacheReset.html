<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Aurora Emergency Recovery</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,rgba(34,211,238,.17),transparent 34%),#020612;color:#eaf4ff;font-family:Inter,system-ui,sans-serif}.card{width:min(620px,100%);padding:28px;border:1px solid rgba(103,232,249,.26);border-radius:26px;background:rgba(5,18,38,.92);box-shadow:0 26px 90px rgba(0,0,0,.5)}.status{display:inline-flex;padding:7px 10px;border:1px solid rgba(251,191,36,.28);border-radius:999px;color:#fde68a;background:rgba(120,53,15,.22);font-size:12px;font-weight:900}.status.ok{color:#bbf7d0;border-color:rgba(52,211,153,.30);background:rgba(20,83,45,.22)}h1{margin:18px 0 10px;font-size:clamp(30px,7vw,52px);letter-spacing:-.055em}p{color:#b8c7d9;line-height:1.55}.log{margin-top:18px;padding:14px;border-radius:15px;background:#020817;color:#a5f3fc;font:700 12px/1.6 ui-monospace,monospace;white-space:pre-line}a{display:inline-flex;margin-top:18px;padding:12px 16px;border-radius:13px;background:#0891b2;color:white;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<span class="status" id="status">Recovery running</span>
<h1>Restoring Aurora</h1>
<p>This clears only browser caches and service-worker registrations. It does <strong>not</strong> erase your Aurora local data, Firebase records or saved financial information.</p>
<div class="log" id="log">Starting recovery…</div>
<a id="continue" href="index.html?aurora-recovery=20260802-2314" hidden>Open restored Aurora</a>
</main>
<script>
(async function(){
  const log=document.getElementById('log');
  const status=document.getElementById('status');
  const link=document.getElementById('continue');
  const add=t=>{log.textContent += '\n'+t};
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg=>reg.unregister()));
      add('✓ Old service workers removed');
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.map(name=>caches.delete(name)));
      add('✓ Old page and image caches removed');
    }
    add('✓ Saved Aurora data left untouched');
    status.textContent='Recovery complete';
    status.classList.add('ok');
    link.hidden=false;
    setTimeout(()=>location.replace(link.href),1200);
  }catch(error){
    add('Recovery warning: '+(error?.message||error));
    link.hidden=false;
  }
})();
</script>
</body>
</html>
