<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Aurora City FC — Browser Cache Reset</title>
<style>
:root{
  color-scheme:dark;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  color:#e8f2ff;
  background:
    radial-gradient(circle at top,rgba(34,211,238,.16),transparent 36%),
    #030712;
}
.card{
  width:min(560px,100%);
  padding:24px;
  border:1px solid rgba(34,211,238,.28);
  border-radius:24px;
  background:#061224;
  box-shadow:0 24px 80px rgba(0,0,0,.45);
  text-align:center;
}
h1{margin:0;font-size:28px}
p{
  margin:12px 0 0;
  color:#9db0c8;
  line-height:1.55;
}
.status{
  margin-top:18px;
  padding:14px;
  border-radius:15px;
  color:#cffafe;
  background:rgba(8,47,73,.55);
}
button,a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  margin-top:18px;
  padding:12px 18px;
  border:1px solid rgba(34,211,238,.38);
  border-radius:14px;
  color:#e6fbff;
  background:#075985;
  font-weight:900;
  text-decoration:none;
}
small{
  display:block;
  margin-top:14px;
  color:#71869f;
}
</style>
</head>
<body>
<main class="card">
  <h1>Aurora browser reset</h1>
  <p>
    Clearing the old service worker and cached website files.
    Your payday plans, transfer mission and saved dashboard settings are preserved.
  </p>
  <div class="status" id="status">Resetting browser cache…</div>
  <a id="continue" href="AuroraCityFC_ManagerDashboard.html?browserReset=20260729" hidden>
    Open Manager Dashboard
  </a>
  <small>Only browser cache files are removed. Local saved Aurora data is not deleted.</small>
</main>
<script>
(async function(){
  const status=document.getElementById("status");
  const link=document.getElementById("continue");

  let registrations=0;
  let cacheCount=0;

  try{
    if("serviceWorker" in navigator){
      const items=await navigator.serviceWorker.getRegistrations();
      registrations=items.length;
      await Promise.all(items.map(item=>item.unregister()));
    }
  }catch(error){
    console.warn(error);
  }

  try{
    if("caches" in window){
      const names=await caches.keys();
      cacheCount=names.length;
      await Promise.all(names.map(name=>caches.delete(name)));
    }
  }catch(error){
    console.warn(error);
  }

  status.textContent=
    `Reset complete — ${registrations} service worker`
    + `${registrations===1?"":"s"} removed and `
    + `${cacheCount} browser cache${cacheCount===1?"":"s"} cleared.`;

  link.hidden=false;

  setTimeout(()=>{
    location.replace(
      "AuroraCityFC_ManagerDashboard.html"
      + "?browserReset="
      + Date.now()
    );
  },1400);
})();
</script>
</body>
</html>
